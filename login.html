<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shoekart - Login</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="login-container">

        <div class="logo">Shoekart 👟</div>

        <!-- Login Form -->
        <div class="form-box" id="loginForm">

            <h2>Welcome Back!</h2>
            <p>Login to your Shoekart account</p>

            <input type="email" id="loginEmail" placeholder="Email Address">

            <input type="password" id="loginPassword" placeholder="Password">

            <button onclick="login()">Login</button>

            <p class="switch">
                Don't have an account?
                <a href="#" onclick="showSignup()">Sign Up</a>
            </p>

        </div>

        <!-- Signup Form -->
        <div class="form-box" id="signupForm">

            <h2>Create Account</h2>
            <p>Join Shoekart today</p>

            <input type="text" id="signupName" placeholder="Full Name">

            <input type="email" id="signupEmail" placeholder="Email Address">

            <input type="password" id="signupPassword" placeholder="Create Password">

            <input type="password" id="confirmPassword" placeholder="Confirm Password">

            <button onclick="signup()">Sign Up</button>

            <p class="switch">
                Already have an account?
                <a href="#" onclick="showLogin()">Login</a>
            </p>

     

    <script src="login.js"></script>

</body>
</html>
